name: Firebase Dev 

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: firebase-dev-verify
  cancel-in-progress: true

jobs:
  android_verify:
    name: Stage 1 - build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build & Unit Tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

  firebase_verify:
    name: Stage 2 - Firebase Verify
    runs-on: ubuntu-latest
    needs: android_verify

    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Write service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "${{ runner.temp }}/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/firebase-sa.json" >> $GITHUB_ENV

      - name: Firebase CLI diagnostics
        run: |
          firebase --version
          firebase --project "$FIREBASE_PROJECT_ID" projects:list || true

      - name: Emulator config
        run: |
          mkdir -p artifacts
          firebase --project "$FIREBASE_PROJECT_ID" emulators:exec --only database,storage \
            "node -e \"console.log('Emulators started, rules/config parsed successfully')\"" \
            2>&1 | tee artifacts/firebase-emulators.log

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-dev-verify-logs
          path: artifacts/firebase-emulators.log
